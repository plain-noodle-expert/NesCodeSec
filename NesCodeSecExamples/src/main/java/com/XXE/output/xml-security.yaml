rules:
  - id: zero-trust-xml-audit
    languages: [java]
    severity: ERROR
    message: "高危：检测到 XML 组件 ($ANY) 的使用。未能在同范围内识别到有效的安全配置（如 disallow-doctype-decl 为 true）。"
    patterns:
      - pattern-either:
          # 只要代码中出现了以下关键词的实例化或方法调用
          - pattern: $P.newInstance(...)
          - pattern: new $P(...)
          - pattern: (DocumentBuilderFactory $P)
          - pattern: (SAXParserFactory $P)
          - pattern: (XMLInputFactory $P)
          - pattern: (SAXReader $P)
          - pattern: (SAXBuilder $P)
          - pattern: (Digester $P)
      
      # 限制变量必须属于这 6 个核心家族（包含全路径匹配）
      - metavariable-regex:
          metavariable: $P
          regex: (?i).*(DocumentBuilderFactory|SAXParserFactory|XMLInputFactory|SAXReader|SAXBuilder|Digester).*

      # --- 排除逻辑 ---
      # 1. 排除已经显式禁用了 DTD 的变量
      - pattern-not-inside: |
          ...
          $ANY.setFeature("http://apache.org/xml/features/disallow-doctype-decl", true);
          ...
      - pattern-not-inside: |
          ...
          $ANY.setFeature(XMLConstants.FEATURE_SECURE_PROCESSING, true);
          ...
      # 2. 排除已经设置了 StAX 安全属性的变量
      - pattern-not-inside: |
          ...
          $ANY.setProperty(XMLInputFactory.SUPPORT_DTD, false);
          ...
      - pattern-not-inside: |
          ...
          $ANY.setProperty("javax.xml.stream.supportDTD", false);
          ...
      - pattern-not-inside: |
          ...
          $ANY.setProperty(XMLInputFactory.IS_SUPPORTING_EXTERNAL_ENTITIES, false);
          ...
      - pattern-not-inside: |
          ...
          $ANY.setProperty("javax.xml.stream.isSupportingExternalEntities", false);
          ...
      - pattern-not-inside: |
          ...
          $ANY.setProperty(XMLConstants.ACCESS_EXTERNAL_DTD, "");
          ...
      - pattern-not-inside: |
          ...
          $ANY.setProperty(XMLConstants.ACCESS_EXTERNAL_SCHEMA, "");
          ...
      - pattern-not-inside: |
          ...
          $ANY.setFeature("http://xml.org/sax/features/external-general-entities", false);
          ...
      - pattern-not-inside: |
          ...
          $ANY.setFeature("http://xml.org/sax/features/external-parameter-entities", false);
          ...
      - pattern-not-inside: |
          ...
          $ANY.setFeature("http://apache.org/xml/features/nonvalidating/load-external-dtd", false);
          ...
      - pattern-not-inside: |
          ...
          $ANY.setXIncludeAware(false);
          ...
      - pattern-not-inside: |
          ...
          $ANY.setExpandEntityReferences(false);
          ...
      - pattern-not-inside: |
          ...
          $ANY.setEntityResolver($RESOLVER);
          ...
